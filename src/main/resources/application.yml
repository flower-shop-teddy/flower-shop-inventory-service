# Cấu hình CHUNG cho mọi môi trường. KHÔNG chứa mật khẩu.
# Secret được truyền vào qua biến môi trường (UAT/PROD lấy từ Vault).
server:
  port: 8084
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
          issuer-uri: flower-shop-identity
          audiences: flower-shop-api

inventory:
  reservation:
    default-hold: 15m            # đơn chưa xác nhận (vd chờ thanh toán) thì giữ hàng tối đa 15 phút
    expiry-batch: 100            # mỗi lần job chạy nhả tối đa 100 phiếu quá hạn
    expiry-interval-ms: 60000
  catalog:
    base-url: http://catalog-service   # tên trên Eureka
    connect-timeout: 2s
    read-timeout: 3s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{userId:-}]"
